<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Šahovski Turnir Menadžer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        h1, h2 {
            text-align: center;
            color: #343a40;
        }
        .container {
            max-width: 800px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #players-section .input-group {
            margin-bottom: 1rem;
        }
        #player-list .list-group-item {
            margin-bottom: 5px;
        }
        .btn-lg {
            margin-top: 20px;
        }
        #tournament-section {
            display: none;
            margin-top: 30px;
        }
        #standings table {
            margin-top: 20px;
        }
        #pairings-list .list-group-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        #pairings-list .form-select {
            width: 150px;
        }
        @media (max-width: 576px) {
            #pairings-list .list-group-item {
                flex-direction: column;
                align-items: flex-start;
            }
            #pairings-list .form-select {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Šahovski Turnir Menadžer</h1>

        <div id="players-section">
            <h2>Igrači</h2>
            <div class="input-group">
                <input type="text" id="player-name" class="form-control" placeholder="Ime igrača" onkeyup="if(event.keyCode===13)addPlayer()">
                <button class="btn btn-primary" onclick="addPlayer()">Dodaj Igrača</button>
            </div>
            <ul id="player-list" class="list-group"></ul>
        </div>

        <div class="text-center mt-4">
            <button class="btn btn-success btn-lg" onclick="createTournament()">Kreiraj Turnir</button>
        </div>

        <div id="tournament-section">
            <div id="pairings">
                <h2 class="mb-3">Parovi</h2>
                <div id="pairings-list"></div>
            </div>

            <div id="standings" class="mt-5">
                <h2 class="mb-3">Poredak</h2>
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Rank</th>
                            <th>Ime</th>
                            <th>Bodovi</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let players = [];
        let tournament = null;

        function addPlayer() {
            const playerNameInput = document.getElementById('player-name');
            const playerName = playerNameInput.value.trim();
            if (playerName && !players.find(p => p.name.toLowerCase() === playerName.toLowerCase())) {
                players.push({ name: playerName, score: 0 });
                renderPlayers();
                playerNameInput.value = '';
            } else if (!playerName) {
                alert('Ime igrača ne može biti prazno.');
            } else {
                alert('Igrač s tim imenom već postoji.');
            }
            playerNameInput.focus();
        }

        function removePlayer(index) {
            players.splice(index, 1);
            renderPlayers();
        }

        function renderPlayers() {
            const playerList = document.getElementById('player-list');
            playerList.innerHTML = '';
            players.forEach((player, index) => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.textContent = player.name;
                const removeButton = document.createElement('button');
                removeButton.className = 'btn btn-danger btn-sm';
                removeButton.textContent = 'Ukloni';
                removeButton.onclick = () => removePlayer(index);
                li.appendChild(removeButton);
                playerList.appendChild(li);
            });
        }

        function createTournament() {
            if (players.length < 2) {
                alert('Potrebna su najmanje 2 igrača za kreiranje turnira.');
                return;
            }
            document.getElementById('players-section').style.display = 'none';
            document.querySelector('.btn-lg').style.display = 'none';
            document.getElementById('tournament-section').style.display = 'block';

            generatePairings();
            renderPairings();
            updateStandings();
        }

        function generatePairings() {
            const playerNames = players.map(p => p.name);
            tournament = {
                players: playerNames,
                rounds: [],
                results: {}
            };

            const numPlayers = playerNames.length;
            let tempPlayers = [...playerNames];

            if (numPlayers % 2 !== 0) {
                tempPlayers.push("BYE");
            }

            const numRounds = tempPlayers.length - 1;

            for (let round = 0; round < numRounds; round++) {
                const currentRound = [];
                for (let i = 0; i < tempPlayers.length / 2; i++) {
                    const player1 = tempPlayers[i];
                    const player2 = tempPlayers[tempPlayers.length - 1 - i];
                    if (player1 !== "BYE" && player2 !== "BYE") {
                        currentRound.push([player1, player2]);
                    }
                }
                tournament.rounds.push(currentRound);

                // Rotate players
                const lastPlayer = tempPlayers.pop();
                tempPlayers.splice(1, 0, lastPlayer);
            }
        }

        function renderPairings() {
            const pairingsList = document.getElementById('pairings-list');
            pairingsList.innerHTML = '';
            tournament.rounds.forEach((round, roundIndex) => {
                const roundDiv = document.createElement('div');
                roundDiv.innerHTML = `<h3 class="h5">Kolo ${roundIndex + 1}</h3>`;
                const roundList = document.createElement('ul');
                roundList.className = 'list-group mb-4';

                round.forEach((pair, pairIndex) => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item';
                    const pairText = `${pair[0]} vs ${pair[1]}`;
                    const resultKey = `${pair[0]}-${pair[1]}`;

                    const resultSelect = `
                        <select class="form-select" onchange="recordResult('${resultKey}', this.value)">
                            <option value="">Unesi rezultat</option>
                            <option value="1-0" ${tournament.results[resultKey] === '1-0' ? 'selected' : ''}>1-0 (Pobjeda ${pair[0]})</option>
                            <option value="0-1" ${tournament.results[resultKey] === '0-1' ? 'selected' : ''}>0-1 (Pobjeda ${pair[1]})</option>
                            <option value="0.5-0.5" ${tournament.results[resultKey] === '0.5-0.5' ? 'selected' : ''}>½-½ (Remi)</option>
                        </select>
                    `;

                    li.innerHTML = `<span>${pairText}</span> ${resultSelect}`;
                    roundList.appendChild(li);
                });

                roundDiv.appendChild(roundList);
                pairingsList.appendChild(roundDiv);
            });
        }

        function recordResult(resultKey, result) {
            tournament.results[resultKey] = result;
            updateStandings();
        }

        function updateStandings() {
            const standings = {};
            players.forEach(p => {
                standings[p.name] = 0;
            });

            for (const resultKey in tournament.results) {
                const [player1, player2] = resultKey.split('-');
                const result = tournament.results[resultKey];
                if (result === '1-0') {
                    standings[player1] += 1;
                } else if (result === '0-1') {
                    standings[player2] += 1;
                } else if (result === '0.5-0.5') {
                    standings[player1] += 0.5;
                    standings[player2] += 0.5;
                }
            }

            const sortedPlayers = Object.keys(standings).sort((a, b) => standings[b] - standings[a]);

            const standingsBody = document.getElementById('standings-body');
            standingsBody.innerHTML = '';
            sortedPlayers.forEach((playerName, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${playerName}</td>
                    <td>${standings[playerName]}</td>
                `;
                standingsBody.appendChild(row);
            });
        }

        // Initial render
        renderPlayers();

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
