<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Theft Awareness Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Identity Theft Awareness Game</h1>
    </header>

    <main>
        <section id="scenario-area">
            <!-- Scenario/question will be displayed here -->
        </section>

        <section id="options-area">
            <!-- Multiple-choice options/buttons will be displayed here -->
        </section>

        <section id="feedback-area">
            <!-- Feedback to the user will be displayed here -->
        </section>

        <section id="score-area">
            Score: 0
        </section>

        <button id="next-button">Start Game</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
